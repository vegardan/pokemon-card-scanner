name: pokemon_card_scanner
description: ""
publish_to: 'none'
version: 0.0.1

environment:
  sdk: ^3.11.5
  flutter: ">=3.44 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  camera: ^0.12.1
  csv: ^8.0.0
  path: ^1.9.1
  path_provider: ^2.1.5
  sensors_plus: ^7.1.0
  shared_preferences: ^2.5.6
  skeletonizer: ^3.0.0
  sqflite: ^2.4.4
  opencv_dart: ^2.2.2
  carousel_slider: ^5.1.2
  photo_view: ^0.15.0
  cancellation_token: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/card_catalog.csv
    - assets/data/data_sources.json
    - assets/data/orb_references/
    - assets/pokemon_back_monochrome.png

hooks:
  user_defines:
    dartcv4:
      include_modules:
        - imgcodecs
        - imgproc
        - features2d
        - calib3d
